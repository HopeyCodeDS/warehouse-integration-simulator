services:
  postgres:
    image: postgres:15-alpine
    container_name: wis-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schemas.sql:/docker-entrypoint-initdb.d/01_schemas.sql
      - ./database/02_erp_schema.sql:/docker-entrypoint-initdb.d/02_erp_schema.sql
      - ./database/03_wms_schema.sql:/docker-entrypoint-initdb.d/03_wms_schema.sql
      - ./database/04_integration_schema.sql:/docker-entrypoint-initdb.d/04_integration_schema.sql
      - ./database/05_seed_data.sql:/docker-entrypoint-initdb.d/05_seed_data.sql
    networks:
      - wis-network
    restart: unless-stopped

  erp-api:
    build: ./services/erp-api
    container_name: wis-erp-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - wis-network
    restart: unless-stopped

  wms-api:
    build: ./services/wms-api
    container_name: wis-wms-api
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
      - mqtt-broker
    networks:
      - wis-network
    restart: unless-stopped

  integration-engine:
    build: ./services/integration-engine
    container_name: wis-integration-engine
    env_file:
      - .env
    environment:
      - WMS_API_URL=http://wms-api:8001/api/tasks
      - PYTHONUNBUFFERED=1 
      - ERP_API_URL=http://erp-api:8000/api/orders
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
    depends_on:
      - postgres
      - wms-api
    networks:
      - wis-network
    restart: unless-stopped
  
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: wis-mqtt-broker
    ports:
      - "1883:1883"    # MQTT protocol port
      - "9001:9001"    # WebSocket port (for React dashboard)
    volumes:
      - ./services/mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - wis-network
    restart: unless-stopped
  
  robot-simulator:
    build: ./services/robot-simulator
    container_name: wis-robot-simulator
    env_file:
      - .env
    environment:
      - ROBOT_ID=AMR-Ultra
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - PYTHONUNBUFFERED=1 
    depends_on:
      - mqtt-broker
    networks:
      - wis-network
    restart: unless-stopped

  opcua-plc-simulator:
    build: ./services/opcua-plc-simulator
    container_name: wis-opcua-plc
    ports:
      - "4840:4840" # Standard OPC UA port
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - wis-network
    restart: unless-stopped

  opcua-gateway:
    build: ./services/opcua-gateway
    container_name: wis-opcua-gateway
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - PYTHONUNBUFFERED=1
    depends_on:
      - opcua-plc-simulator
      - mqtt-broker
    networks:
      - wis-network
    restart: unless-stopped
  
  commissioning-api:
    build: ./services/commissioning-api
    container_name: wis-commissioning
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
      - mqtt-broker
      - opcua-plc-simulator
    networks:
      - wis-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  wis-network:
    driver: bridge